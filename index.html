<<!DOCTYPE html>
    <html>

    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mini Bird</title>

        <style>
            body {
                margin: 0;
                background: #222;
                color: #fff;
                text-align: center;
                font-family: sans-serif;
            }
            
            canvas {
                background: #70c5ce;
                display: block;
                margin: 10px auto;
                width: 95vw;
                height: 75vh;
                border-radius: 10px;
            }
        </style>
    </head>

    <body>

        <h3>Score: <span id="s">0</span></h3>
        <canvas id="c"></canvas>
        <p>Tap / Click / SPACE</p>

        <script>
            const c = document.getElementById("c"),
                ctx = c.getContext("2d");

            function resize() {
                c.width = c.clientWidth;
                c.height = c.clientHeight;
            }
            resize();
            window.onresize = resize;

            let y = c.height / 2,
                v = 0,
                score = 0,
                pipes = [],
                over = false;

            function flap() {
                over ? reset() : v = -8;
            }
            window.onclick = flap;
            window.ontouchstart = flap;
            window.onkeydown = e => {
                if (e.code === "Space") flap();
            };

            function reset() {
                y = c.height / 2;
                v = 0;
                score = 0;
                pipes = [];
                over = false;
                loop();
            }

            function loop() {
                if (over) return;

                v += 0.5;
                y += v;
                ctx.clearRect(0, 0, c.width, c.height);

                // bird
                ctx.fillStyle = "yellow";
                ctx.fillRect(60, y, 25, 25);

                // pipes
                if (!pipes.length || pipes[pipes.length - 1].x < c.width / 2)
                    pipes.push({
                        x: c.width,
                        y: Math.random() * 200 + 50
                    });

                pipes.forEach((p, i) => {
                    p.x -= 3;
                    ctx.fillStyle = "green";
                    ctx.fillRect(p.x, 0, 40, p.y);
                    ctx.fillRect(p.x, p.y + 120, 40, c.height);

                    if (60 + 25 > p.x && 60 < p.x + 40)
                        if (y < p.y || y + 25 > p.y + 120) over = true;

                    if (p.x === 60) {
                        score++;
                        s.innerText = score;
                    }

                    if (p.x < -40) pipes.splice(i, 1);
                });

                if (y > c.height || y < 0) over = true;

                if (over) {
                    ctx.fillStyle = "rgba(0,0,0,0.6)";
                    ctx.fillRect(0, 0, c.width, c.height);
                    ctx.fillStyle = "white";
                    ctx.fillText("Game Over", c.width / 2 - 40, c.height / 2);
                } else requestAnimationFrame(loop);
            }

            reset();
        </script>

    </body>

    </html>
